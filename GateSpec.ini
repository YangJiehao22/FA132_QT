; GateSpec.ini - 与 DtSample.exe 同目录
; 可在「规格设定」对话框修改，也可直接编辑本文件（分号开头为注释行）

[timing]
; LightTest 开流后等待多久再采样(毫秒)，建议>=2000，等图像/电流稳定
DelayMs=6000
; Enabled=0 且读 SensorID/校验后，光测采帧率前等待(毫秒)；烧录=1 时不使用；0=不等待
PostI2cDelayMs=2000

[limits]
; 各 Dev/VC 默认共用：Sensor 帧率、电流(mA)、芯片温度(C) 合格范围
MinSsrFps=1.000
MaxSsrFps=200.000
MinCurrent_mA=0.000
MaxCurrent_mA=2000.000
MinSensorTemp_C=-40.000
MaxSensorTemp_C=125.000

[sensor_temp_i2c]
; 温度公式 Temp(C)=(b0*CoeffLow+b1*CoeffHigh)/Divisor+Offset（所有设备/VC 共用）
; Enabled=1 时 LightTest 读 I2C 温度并参与判定
Enabled=1
I2cMode=3
RegLow=0x1F40
RegHigh=0x1F41
CoeffLow=1.000
CoeffHigh=256.000
Divisor=16.000
Offset=-50.000

[sensor_temp_i2c_vc]
; FA132 每路 Sensor I2C 从机（光测温度 + 烧录/SensorID/校验共用）
; V0/V1=Chip0(0x64/0x62)  V2/V3=Chip1(0x68/0x66)；D0..D7=第一块 FA132 八位
; D8..D31 未写键时程序继承 D(dev%8)_V#（第二~四块 FA132 同物理位同地址）
D0_V0=0x64
D0_V1=0x62
D0_V2=0x68
D0_V3=0x66
D1_V0=0x64
D1_V1=0x62
D1_V2=0x68
D1_V3=0x66
D2_V0=0x64
D2_V1=0x62
D2_V2=0x68
D2_V3=0x66
D3_V0=0x64
D3_V1=0x62
D3_V2=0x68
D3_V3=0x66
D4_V0=0x64
D4_V1=0x62
D4_V2=0x68
D4_V3=0x66
D5_V0=0x64
D5_V1=0x62
D5_V2=0x68
D5_V3=0x66
D6_V0=0x64
D6_V1=0x62
D6_V2=0x68
D6_V3=0x66
D7_V0=0x64
D7_V1=0x62
D7_V2=0x68
D7_V3=0x66

[bad_pixel_dark]
; 黑场亮坏点检测：须在暗场下测试(盖镜头/暗箱)，在 LightTest 延时后执行
Enabled=1
AlgoMode=1
MaxBadPixels=0
HotDelta=30
BrightContrastCluster=30
ClusterMinPixels=2
SingleDefectPermyriad=1
GrGbToG=1
HotAbsMin=25
BorderPx=2
SaveSnapshot=1
SaveBmp=1
SavePackedRaw=1
SaveUnpack12=1
SaveUnpack10=1
SaveDir=D:\FA132\hotpixel

[firmware_burn]
; ---------- 总开关 ----------
; Enabled：是否执行 Flash 烧录。=1 写 512KB bin；=0 不烧录（可与 VerifyEnabled 单独开校验）
Enabled=0
; VerifyEnabled：是否做烧录后 14 个标定寄存器校验（与 Enabled 无关）。=1 须已 Open+Start
VerifyEnabled=1
; VerifyBeforeGrab：校验前是否只 InitPower 不 InitGrab。=0 抓图运行中读寄存器（UC930/FA132 推荐）
;                    =1 仅上电读寄存器（FA132 实验项，易报找不到从机）
VerifyBeforeGrab=0
; ReadSensorIdEnabled：是否读 SensorID（0x7E80 起 10 个寄存器）。=0 跳过
;                    Enabled=1：Prep 后、烧 Flash 前读（未出流）
;                    Enabled=0：Start 出流并 DelayMs 稳定后再读，然后校验/光测
;                    Fa132DualChip=1 时：先 Chip0 各 VC 并行读，再 Chip1 各 VC 并行读
ReadSensorIdEnabled=1
; ---------- 固件文件 ----------
; FovType：FOV/镜头型号名，对应 bin 文件名 031{FovType}.bin（与睿博 RABO* 一致）
FovType=RABOB065200
; FovTypeIndex：FovType 在程序内序号 0~4，若写了 FovType 字符串则以 FovType 为准
FovTypeIndex=0
; FlashDataDir：bin 相对 exe 的子目录，完整路径为 exe\{FlashDataDir}\031{FovType}.bin
FlashDataDir=FlashData
; ---------- 时序（毫秒） ----------
; FwWarmupMs：仅「烧录」流程：Prep(InitPower/InitGrab) 完成后、写 Flash 前的稳定等待
;             校验/光测前的等待请用 [timing] DelayMs，不要用本项
FwWarmupMs=3000
; PostBurnDelayMs：保留项；当前校验前等待已改用 [timing] DelayMs
PostBurnDelayMs=1000
; ---------- I2C / 从机 ----------
; I2cRateKbps：烧录/校验前 SetSensorI2cRateEx 速率（kHz），FA132 常用 400~800
I2cRateKbps=400
; AutoDetectSlave：GateSpec 未配 D#_V# 从机地址时，是否扫描 0x36/0x34。多 VC 建议 =0，用手动地址
AutoDetectSlave=1
; UseMipiVcForBurn：多 VC 时烧录/校验/SensorID 前是否 SetMipiImageVC 切到该路。FA132 须 =1
UseMipiVcForBurn=1
; ---------- FA132 双 96718 芯片（carSetChipID） ----------
; Fa132DualChip：是否按 VC 切换芯片。=1 时 VC<DualChipVcSplit 用 ChipID0，>= 用 ChipID1
;                烧录/校验/SensorID 均分两阶段：先 Chip0 各 VC 并行，再 Chip1 各 VC 并行（避免选片冲突）
Fa132DualChip=1
; DualChipVcSplit：芯片分界 VC 号。默认 2 表示 VC0/1→第一颗芯片，VC2/3→第二颗芯片
DualChipVcSplit=2
; ---------- 烧录后流程 ----------
; GrabIniAfterPowerCycle：断电上电后校验/光测用的 GrabTab ini（烧录仍用主界面 Load 的 sensor INI）
; 含中文路径时请在 Spec-Firmware 页重新浏览保存一次（勿手改出 ????）
GrabIniAfterPowerCycle=
; PowerCycleAfter：=1 且 Enabled=1 烧录结束后 Stop→断电 2s→再 Start，然后校验/光测
;                  仅校验(Enabled=0) 时不会断电上电
PowerCycleAfter=1

[tcp_notify]
Enabled=0
PeerHost=127.0.0.1
PeerPort=9000
OnlyOnOverallOk=0
ConnectTimeoutMs=3000
SendTimeoutMs=2000
WaitResponse=1
RecvTimeoutMs=3000
RetryCount=2
