; GateSpec.ini - 与 DtSample.exe 同目录
; 可在「规格设定」对话框修改，也可直接编辑本文件（分号开头为注释行）

[timing]
; LightTest 开流后等待多久再采样(毫秒)，建议>=2000，等图像/电流稳定
DelayMs=6000

[limits]
; 各 Dev/VC 默认共用：Sensor 帧率、电流(mA)、芯片温度(C) 合格范围
MinSsrFps=1.000
MaxSsrFps=200.000
MinCurrent_mA=0.000
MaxCurrent_mA=2000.000
MinSensorTemp_C=-40.000
MaxSensorTemp_C=125.000

[sensor_temp_i2c]
; 温度公式 Temp(C)=(b0*CoeffLow+b1*CoeffHigh)/Divisor+Offset（所有设备/VC 共用）
; Enabled=1 时 LightTest 读 I2C 温度并参与判定
Enabled=1
I2cMode=3
RegLow=0x1F40
RegHigh=0x1F41
CoeffLow=1.000
CoeffHigh=256.000
Divisor=16.000
Offset=-50.000

[sensor_temp_i2c_vc]
; 每设备每路 VC 独立 I2C 地址，键名 D{设备}_V{VC}，公式见 [sensor_temp_i2c]
D0_V0=0x34
D0_V1=0x84
D0_V2=0x86
D0_V3=0x88
D1_V0=0x34
D1_V1=0x84
D1_V2=0x86
D1_V3=0x88
D2_V0=0x34
D2_V1=0x84
D2_V2=0x86
D2_V3=0x88
D3_V0=0x34
D3_V1=0x84
D3_V2=0x86
D3_V3=0x88
D4_V0=0x34
D4_V1=0x84
D4_V2=0x86
D4_V3=0x88
D5_V0=0x34
D5_V1=0x84
D5_V2=0x86
D5_V3=0x88
D6_V0=0x34
D6_V1=0x84
D6_V2=0x86
D6_V3=0x88
D7_V0=0x34
D7_V1=0x84
D7_V2=0x86
D7_V3=0x88

[bad_pixel_dark]
; 黑场亮坏点检测：须在暗场下测试(盖镜头/暗箱)，在 LightTest 延时后执行
Enabled=1
AlgoMode=1
MaxBadPixels=0
HotDelta=30
BrightContrastCluster=30
ClusterMinPixels=2
SingleDefectPermyriad=1
GrGbToG=1
HotAbsMin=25
BorderPx=2
SaveSnapshot=1
SaveBmp=1
SavePackedRaw=1
SaveUnpack12=1
SaveUnpack10=1
SaveDir=D:\FA132\hotpixel

[firmware_burn]
Enabled=0
FovType=RABOB065200
FovTypeIndex=0
FlashDataDir=FlashData
FwWarmupMs=3000
PostBurnDelayMs=1000
I2cRateKbps=400
AutoDetectSlave=1
PowerCycleAfter=1
