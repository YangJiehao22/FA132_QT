##全局设置
[global]
enable      =   1;                调试信息使能
all         =   0;                全开
logfile     =   1;                直接记录的dtdbg.log文件中
maxCount    =   20000;           一个文件允许最多的记录数
keep        =   0;                错误和警告信息出现的时候，将最近的调试信息保存到文件，0为关闭，keep记录数
autokeep    =   0;                自动保持使能，使能后，一般信息（info、proc）将不写入文件，而是先保持在内存中，采用循环记录方式；当发生警告和错误时，将触发写入到文件
new         =   0;                新的文件记录方式，用4个文件，滚动记录，可以避免文件个数的增加
remote      =   0;                远端打印信息，如主单片机，电源模块调试信息	
logfilePath = 
##vfvlog模式配置
vfvlog      =   1;                是否启用 vfvlog 模式，该模式下还由“logfile”参数指定是否用文件记录（logfile=1），还是共享内存方式（logfile=0）
vfvFileSize =   67108864;         vfvlog 模式下，配置文件大小  
vfvBufSize  =   16777216;         vfvlog 模式下，配置共享内存大小 
sizechange  =   0；               size change触发产生internal信息记录新的文件和生成波形文件

[device_global]
enable      =   0;                调试信息使能,设备端打印信息对效率有影响
all         =   0;

