##调试打印等级
error	      =    1;           错误信息
warn	      =    1;           警告信息
info	      =    1;           提示信息
proc	      =    0;           过程信息，过程信息一般比较大，建议在调试流程性问题的时候开启
dump	      =    1;           直接dump文本信息，不做格式化处理
##link类型主要是底层通讯层，有大量的info和proc信息，默认只要打开error和warn即可
