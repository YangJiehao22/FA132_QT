//TestVolt(测试电压)           : int, unit mV
//PowerCurrent(电源测试电流)   : int, unit uA
//GpioCurrent(GPIO测试电流)    : int, unit uA
//Positive(正向)               : bool
//Negative(负向)               : bool
//commonGND(共地模式)          : bool
//IoMask_L                     : unsigned short , OS pin0-pin16
//IoMask_M                     : unsigned short , OS pin17-pin31
//IoMask_H                     : unsigned short , OS pin32-pin47
[OpenShort]
