//www.dothinkey.com

[ezDTCCM_Config]
version = 1.3

[Vendor]
VendorName = Max

//type          : 0-DVP Raw10; 1-Raw8; 2-YUV422; 3-RAW16; 4-RGB565; 
//type          : 5-YUV SPI; 6-MIPI Raw10; 7-Raw12; 8- YUV_MTK_SPI; 11-Raw14
//port          : 0-MIPI; 1-Parallel; 2-MTK; 3-SPI; 4-TEST; 5-HISPI; 6-Z2P/Z4P; 129-SONY_LVDS; 133-PANASONIC
//outformat     : 0-YCbYCr/RG_GB; 1-YCrYCb/GR_BG; 2-CbYCrY/GB_RG; 3-CrYCbY/BG_GR
//mclk          : double, unit MHz
//pwdn_pin      : bool, pwdn work status; 0-pwdn_pin low; 1-pwdn_pin high
//reset_pin     : bool, reset work status; 0-reset_pin low; 1-reset_pin high

[Sensor]
SensorName = max96722_96701
width = 1280
height = 960
port = 0
type = 2
pwdn_pin = 1
reset_pin = 1
outformat = 0

//[Sensor_IIC]  : IIC设置
//mode(iic)     : 0-8Addr,8Data; 1-8Addr,8Data(stop); 2-8Addr,16Data; 3-16Addr,8Data; 4-16Addr,16Data
//rate(iic)     : 10 - 2000KHz
//initRegMode(初始化sensor寄存器方式) : 0-BATCH(批量); 1-SINGLE(单个)
//ignoreInitSensorResult : bool, 0-don't ignore init sensor result; 1-ignore init sensor result;
//externalI2CPullUp : bool, 0-no external i2c pull up; 1-have external i2c pull up;
//checkChipID   : bool, 0-don't check sensor chip id; 1-check sensor chip id;
[Sensor_IIC]
slaveID = 0x52
slaveID_Ser = 0x80
slaveID_ImgSsr = 0x34
mode = 3
rate = 400
rapid = 0
interval = 0
ackWait = 3000
ignoreInitSensorResult = 0
externalI2CPullUp = 0

//PMU [volt,onOff,rise,ocpCurrentLimit,rang_Work,sampleSpeed_Work,rang_Standby,sampleSpeed_Standby,time]
//PMU [电压,开/关,上升斜率,软件限流,工作挡位,工作电流采样速率,待机挡位,待机电流采样速率,上电时序]
//volt             : int, mV
//rise             : int
//onOff            : bool, 0-power off, 1-power on
//ocpCurrentLimit  : int, mA
//rang_Work        : 0-CURRENT_RANGE_MA, 1-CURRENT_RANGE_UA, 2-CURRENT_RANGE_NA, 3-CURRENT_RANGE_NA2
//sampleSpeed_Work : int
//rang_Standby     : 0-CURRENT_RANGE_MA, 1-CURRENT_RANGE_UA, 2-CURRENT_RANGE_NA, 3-CURRENT_RANGE_NA2
//sampleSpeed_Standby: int
//time             : int, ms
[PMU]
SENSOR_0 = 7000,1,100,350,0,200,1,50,0
SENSOR_1 = 7000,1,100,350,0,200,1,50,0
SENSOR_2 = 7000,1,100,350,0,200,1,50,0
SENSOR_3 = 7000,1,100,350,0,200,1,50,0
VDDIO = 3300,1,100,350,0,200,1,50,0


//GRAB : 采集设置
//TargetFormat(目标图像格式)  : 0x00-RAW10, 0x01-RAW8/MIPI_RAW8, 0x02-YUV, 0x03-RAW16/MIPI_RAW16, 0x04-RGB565, 0x05-YUV_SPI, 0x06-MIPI_RAW10, 0x07-MIPI_RAW12, 
//TargetFormat(目标图像格式)  : 0x08-YUV_MTK_S, 0x09-YUV_10, 0x0a-YUV_12, 0x0b-MIPI_RAW14, 0x20-BGR24/RGB888, 0x21-BGR32, 0x24-P10, 0x25-P12, 0x26-P14, 0x28-G8, 0x29-G10, 0x2a-GRAY8, 
//roi_x_start                 : int
//roi_y_start                 : int
//FilterCrcError			  : bool, 1-Filter Crc Error frame/过滤掉crc错误帧
//FilterSizeError			  : bool, 1-Filter size Error frame/过滤掉size错误帧
//Raw2RgbAlgorithm(插值算法)  : 0-RAW2RGB_NORMAL, 1-RAW2RGB_SMOOTH, 2-RAW2RGB_SHARP
[GRAB]
TargetFormat = 32
roi_x_start = 0
roi_y_start = 0
FilterCrcError = 0
FilterSizeError = 0
Raw2RgbAlgorithm = 0

//phyType        : 0 - MIPI_DPHY_1_5G, 1 - MIPI_DPHY_2_5G, 2 - MIPI_CPHY, 
//laneCnt        : 1/2/3/4 laneCnt or 1/2/3 trio
//checkMipiLP01  : bool, 对CLK Lane的LP-10状态进行检查，如果没有这个状态，将会一直等待
//LRTE           : bool, 开启LRTE模式
//MipiMode       : bool, 1-多VC模式(该模式下，可指定哪个VC是帧开始或帧结束), 0-普通模式(检测到哪个VC短包先出,就作为帧开始和帧结束)
//FullCap        : bool, 1-完整数据包获取，包括包头和CRC16校验，将导致每行图像数据增加6字节
//FsForVc        : unsigned char, 指定VC为FS(0,1,2,3)
//FeForVc        : unsigned char, 指定VC为FE(0,1,2,3)
//Lp00MinTime    : int, LP00的最小时间，单位是：1个时钟周期
//ShortPacket    : bool, 短包输出使能
//PackCount      : 过滤DataID的数量
//PackID         : int, MipiPacketFilter, 使能输出的ID号
//VC_Count       : 虚拟通道数量
//VC             : virtual channel, VC[packID,height], 多VC模式，MipiMode = 1，开启全包采集FullCap=TRUE
[MIPI]
phyType = 0
laneCnt = 4
LpEn = 0
checkMipiLP01 = 0
MipiMode = 0
Lp00MinTime = 0

