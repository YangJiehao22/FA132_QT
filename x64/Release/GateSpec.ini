; GateSpec.ini - 与 DtSample.exe 同目录
; 可在「规格设定」对话框修改，也可直接编辑本文件（分号开头为注释行）

[timing]
; LightTest 开流后等待多久再采样(毫秒)，建议>=2000，等图像/电流稳定
DelayMs=12000

[limits]
; 各 Dev/VC 默认共用：Sensor 帧率、电流(mA)、芯片温度(C) 合格范围
MinSsrFps=1.000
MaxSsrFps=200.000
MinCurrent_mA=0.000
MaxCurrent_mA=2000.000
MinSensorTemp_C=-40.000
MaxSensorTemp_C=125.000

[sensor_temp_i2c]
; 温度公式 Temp(C)=(b0*CoeffLow+b1*CoeffHigh)/Divisor+Offset，b0/b1 来自 RegLow/RegHigh
; Enabled=1 时 LightTest 读 I2C 温度并参与判定
Enabled=0
; I2C 从机地址(十六进制)
I2cAddr=0x34
; I2C 读写模式(与 SDK carReadSensorI2c 一致)
I2cMode=3
; 温度寄存器地址(十六进制)，RegHigh=0 表示只读单字节
RegLow=0x1F40
RegHigh=0x1F41
CoeffLow=1.000
CoeffHigh=256.000
Divisor=16.000
Offset=-50.000

[sensor_temp_i2c_vc]
; FA132 最多 8 设备 x 4 VC，键名 D{0..7}_V{0..3}，与主界面预览格一致
D0_V0=0x34
D0_V1=0x62
D0_V2=0x68
D0_V3=0x66
D1_V0=0x64
D1_V1=0x62
D1_V2=0x68
D1_V3=0x66
D2_V0=0x64
D2_V1=0x62
D2_V2=0x68
D2_V3=0x66
D3_V0=0x64
D3_V1=0x62
D3_V2=0x68
D3_V3=0x66
D4_V0=0x64
D4_V1=0x62
D4_V2=0x68
D4_V3=0x66
D5_V0=0x64
D5_V1=0x62
D5_V2=0x68
D5_V3=0x66
D6_V0=0x64
D6_V1=0x62
D6_V2=0x68
D6_V3=0x66
D7_V0=0x64
D7_V1=0x62
D7_V2=0x68
D7_V3=0x66

[bad_pixel_dark]
; 黑场亮坏点检测：须在暗场下测试(盖镜头/暗箱)，在 LightTest 延时后执行
; Enabled=1 开启；=0 关闭(不报 BadPx)
Enabled=0
; AlgoMode: 0=8邻域简单算法  1=华为分通道算法(推荐，要求中心10% ROI均值<=50)
AlgoMode=0
; BayerPattern: -1=自动(SDK/传感器ini)  0=RGGB 1=GRBG 2=GBRG 3=BGGR(08B等常为3)
BayerPattern=-1
; MaxBadPixels: 华为=每颜色通道允许亮点簇个数上限；8邻域=热点总数上限
MaxBadPixels=0
; HotDelta: 华为=单伤阈值|像素-全图均值|；8邻域=相对8邻域均值的增量
HotDelta=30
; BrightContrastCluster: 华为亮点群(簇)阈值，0=与 HotDelta 相同
BrightContrastCluster=30
; ClusterMinPixels: 华为判定为簇的最少像素数(连通域>=此值才计1簇)
ClusterMinPixels=2
; SingleDefectPermyriad: 华为单伤上限，单位=个/10万像素(如1表示约每100万像素允许1个单伤)
SingleDefectPermyriad=1
; GrGbToG: 华为是否将 Gr+Gb 合并为 G 通道统计(1=合并 0=R/Gr/Gb/B 四通道)
GrGbToG=1
; HotAbsMin: 8邻域专用，像素灰度绝对下限(低于此不判热点)
HotAbsMin=25
; BorderPx: 8邻域专用，图像四边忽略宽度(像素)
BorderPx=2
; SaveSnapshot: 1=PASS与FAIL均抓图；0=不保存
SaveSnapshot=0
; SaveBmp/SavePackedRaw/SaveUnpack12/SaveUnpack10: 勾选才保存对应文件
SaveBmp=1
SavePackedRaw=0
SaveUnpack12=0
SaveUnpack10=1
; SaveDir: 抓图与 CSV 根目录，留空则使用 exe\log\LightTest\
SaveDir=D:\FA132\hotpixel

[firmware_burn]
; Sony ISX031：与睿博一致 exe\FlashData\031{FovType}.bin（512KB）
; 须先 Open 再 Start；烧录前仅 I2C/上电 init，不抓图；FwWarmupMs 后再烧录
; Enabled=1 开启；烧录 NG 则 Stop，不进入 LightTest
Enabled=1
; ReadSensorIdEnabled=1 烧录前并行读 SensorID(0x7E80x10)；=0 关闭
ReadSensorIdEnabled=1
; FovType: RABOB065200 | RABOM826200 | RABOM826100 | RABOM82660Flip | RABOM82660
FovType=RABOM826200
FovTypeIndex=1
FlashDataDir=FlashData
; FwWarmupMs: 烧录前稳定等待(ms)，不要求出图；上电后二次 Start 仍用此项做 settle
FwWarmupMs=5000
; PostBurnDelayMs: 烧录检验 PASS 后到 LightTest 的等待(ms)；此前已完成下电/上电/FwWarmup/14寄存器检验
PostBurnDelayMs=1000
I2cRateKbps=800
AutoDetectSlave=1
PowerCycleAfter=1
; VerifyEnabled: after burn, Stop 2s + Start + FwWarmupMs, then 14-reg check (needs PowerCycleAfter=1)
VerifyEnabled=1
