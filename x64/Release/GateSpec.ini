[bad_pixel_dark]
; 黑场亮坏点检测：须在暗场下测试(盖镜头/暗箱)，在 LightTest 延时后执行
; Enabled=1 开启；=0 关闭(不报 BadPx)
Enabled=0
; AlgoMode: 0=8邻域简单算法  1=华为分通道算法(推荐，要求中心10% ROI均值<=50)
AlgoMode=1
; BayerPattern: -1=自动(SDK/传感器ini)  0=RGGB 1=GRBG 2=GBRG 3=BGGR(08B等常为3)
BayerPattern=-1
; MaxBadPixels: 华为=每颜色通道允许亮点簇个数上限；8邻域=热点总数上限
MaxBadPixels=0
; HotDelta: 华为=单伤阈值|像素-全图均值|；8邻域=相对8邻域均值的增量
HotDelta=30
; BrightContrastCluster: 华为亮点群(簇)阈值，0=与 HotDelta 相同
BrightContrastCluster=30
; ClusterMinPixels: 华为判定为簇的最少像素数(连通域>=此值才计1簇)
ClusterMinPixels=2
; SingleDefectPermyriad: 华为单伤上限，单位=个/10万像素(如1表示约每100万像素允许1个单伤)
SingleDefectPermyriad=1
; GrGbToG: 华为是否将 Gr+Gb 合并为 G 通道统计(1=合并 0=R/Gr/Gb/B 四通道)
GrGbToG=1
; HotAbsMin: 8邻域专用，像素灰度绝对下限(低于此不判热点)
HotAbsMin=25
; BorderPx: 8邻域专用，图像四边忽略宽度(像素)
BorderPx=2
; SaveSnapshot: 1=PASS与FAIL均抓图；0=不保存
SaveSnapshot=0
; SaveBmp/SavePackedRaw/SaveUnpack12/SaveUnpack10: 勾选才保存对应文件
SaveBmp=1
SavePackedRaw=0
SaveUnpack12=0
SaveUnpack10=1
; SaveDir: 抓图与 CSV 根目录，留空则使用 exe\log\LightTest\
SaveDir=D:\FA132\hotpixel

[firmware_burn]
; Sony ISX031：bin 路径 exe\{FlashDataDir}\031{FovType}.bin（512KB）。须先 Open 再 Start
; ---------- 总开关 ----------
; Enabled：是否执行 Flash 烧录。=1 写 bin；=0 不烧录（可单独开 VerifyEnabled 只做校验）
Enabled=0
; VerifyEnabled：是否做 14 寄存器标定校验（与 Enabled 无关）。=1 须 Open+Start
VerifyEnabled=1
; VerifyBeforeGrab：=0 抓图 InitGrab 后读寄存器（推荐）；=1 仅 InitPower 读（易找不到从机）
VerifyBeforeGrab=0
; ReadSensorIdEnabled：读 SensorID（0x7E80×10）。Enabled=0 为出流+DelayMs 后读；Enabled=1 为烧录前读
;                    Fa132DualChip=1 时先 Chip0 并行读再 Chip1 并行读（与烧录/校验一致）
ReadSensorIdEnabled=1
; ---------- 固件文件 ----------
; FovType：RABOB065200 | RABOM826200 | RABOM826100 | RABOM82660Flip | RABOM82660
FovType=RABOM826200Flip
; FovTypeIndex：型号序号 0~4，若已写 FovType 字符串则以 FovType 为准
FovTypeIndex=3
; FlashDataDir：bin 相对 exe 子目录
FlashDataDir=FlashData
; ---------- 时序（毫秒） ----------
; FwWarmupMs：仅烧录：Prep 完成后、写 Flash 前等待；校验/光测用 [timing] DelayMs
FwWarmupMs=5000
; PostBurnDelayMs：保留；校验前等待已用 [timing] DelayMs
PostBurnDelayMs=1000
; ---------- I2C / 从机 ----------
; I2cRateKbps：烧录/校验前 I2C 速率(kHz)
I2cRateKbps=800
; AutoDetectSlave：未配 D#_V# 时是否扫 0x36/0x34；多 VC 建议 0，用 [sensor_temp_i2c_vc]
AutoDetectSlave=0
; UseMipiVcForBurn：=1 每路烧录/校验前 SetMipiImageVC；FA132 须 1
UseMipiVcForBurn=1
; ---------- FA132 双芯片 carSetChipID ----------
; Fa132DualChip：=1 按 VC 切芯片；烧录/校验/SensorID 均先 Chip0 并行再 Chip1 并行
Fa132DualChip=1
; DualChipVcSplit：分界 VC，默认 2→VC0/1 第一颗，VC2/3 第二颗
DualChipVcSplit=2
; ---------- 烧录后流程 ----------
; GrabIniAfterPowerCycle：断电上电后校验/光测用的 GrabTab ini（主界面 Load 仍为烧录前点亮）
; 含中文路径请用 Spec-Firmware 浏览保存（程序会按 GBK 正确写入本行）
GrabIniAfterPowerCycle=D:\FA132\点亮文件\CC_ISX031_MAX96717F_YUV_1920X1441_dtpara .ini
; PowerCycleAfter：=1 且 Enabled=1 烧录后断电上电再校验；仅校验时不断电
PowerCycleAfter=1

[aging_test]
; 总开关：=0 时与未加老化功能前完全一致（不连温箱、不采样）
Enabled=0
; =1：Start 时并行设温+启动温箱；=0：光测后再加热（一般不推荐）
HeatAtStart=1

[oven]
; 温箱 Modbus TCP（U/D 为同一控制器双腔体，共用 IP/Port/UnitId）
Enabled=1
Profile=Siemens_1200
Host=192.168.1.10
Port=8000
UnitId=1
TempScale=10
TargetC=85.0
ReadyToleranceC=2.0
WaitTimeoutMin=120
PollIntervalMs=5000
ConnectTimeoutMs=3000
IoTimeoutMs=2000
RetryCount=2
DualChamber=1
HeatMode=Both
CooldownEnabled=1
CooldownTargetC=40.0
CooldownToleranceC=2.0
CooldownTimeoutMin=90
; U 腔寄存器（Profile 非 Custom 时自动填充）
RegUSetTemp=4
RegUStart=0
RegUStop=1
RegUPv=6
RegURunState=2
RegURunBit=-2
RegUFault=3
; D 腔寄存器（S1200：Start=30 Stop=31 Run=32 Fault=33 SetTemp=34 SV=35 PV=36）
RegDSetTemp=34
RegDStart=30
RegDStop=31
RegDPv=36
RegDRunState=32
RegDRunBit=-2
RegDFault=33

[aging_gate]
; 老化时长(分钟)、采样间隔(秒)
DurationMin=60
SampleIntervalSec=30
; 老化判定门限（可与 [limits] 不同；留空则读取时继承 [limits]）
MinSsrFps=1.000
MaxSsrFps=200.000
MinCurrent_mA=0.000
MaxCurrent_mA=2000.000
MinSensorTemp_C=-40.000
MaxSensorTemp_C=125.000
; 三路工作电压门限(V)，需 [aging_voltage_i2c] Enabled=1 才参与判定
MinAvdd_V=1.00
MaxAvdd_V=4.00
MinIovdd_V=1.00
MaxIovdd_V=4.00
MinDvdd_V=1.00
MaxDvdd_V=4.00

[aging_voltage_i2c]
; 老化采样：AVDD/IOVDD/DVDD（从机地址用 [sensor_temp_i2c_vc] D#_V#）
; Fa132DualChip=1 时按 Chip0/Chip1 分阶段并行读（与 [firmware_burn] 校验/SensorID 一致）
; I2cMode=3：每路读低/高字节，raw16 = Lo + Hi*256（先低后高），mV = raw16 * 1000 / Scale
Enabled=1
I2cMode=3
RegAvdd=0x1E40
RegAvddHigh=0x1E41
RegIovdd=0x1E42
RegIovddHigh=0x1E43
RegDvdd=0x1E44
RegDvddHigh=0x1E45
Scale=1000.0

[tcp_notify]
; TCP Client: after all VC tests + Production_report.csv, one Play cmd {"Order":"Play","SNList":[]}\n
Enabled=0
; CloseBoxAfterTest=1 且 Enabled=1：Stop 后 Close 测试盒再 Play；两开关缺一则不自动 Close
CloseBoxAfterTest=0
PeerHost=192.168.1.101
PeerPort=5000
; OnlyOnOverallOk=1: send only when overall PASS
OnlyOnOverallOk=0
ConnectTimeoutMs=3000
SendTimeoutMs=2000
WaitResponse=1
RecvTimeoutMs=3000
RetryCount=2
